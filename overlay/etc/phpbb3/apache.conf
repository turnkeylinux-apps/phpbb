<VirtualHost *:80>
    UseCanonicalName Off
    ServerAdmin  webmaster@localhost
    DocumentRoot /var/www/phpBB/
</VirtualHost>

<VirtualHost *:443>
    SSLEngine on
    ServerAdmin  webmaster@localhost
    DocumentRoot /var/www/phpBB/
</VirtualHost>

<Directory /var/www/phpBB/>
    Options FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>
